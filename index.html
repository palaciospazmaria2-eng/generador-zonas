<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Planillas Oficiales</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @media print {
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
      body {
        background: white !important;
        color: black !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      #mainContainer {
        display: block !important;
        max-width: 100% !important;
        padding: 0 !important;
      }
      #previewContainer {
        background: none !important;
        border: none !important;
        padding: 0 !important;
        box-shadow: none !important;
      }
      .sheet-canvas {
        max-width: 100% !important;
        width: 100% !important;
        box-shadow: none !important;
      }
    }

    .sheet-canvas {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      box-sizing: border-box;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    }

    .sheet-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .sheet-table th, .sheet-table td {
      border: 1.5px solid #000000;
      text-align: center;
      vertical-align: middle;
      font-weight: 700;
      color: #000000;
      padding: 6px 4px;
      font-size: 13px;
      line-height: 1.2;
      word-wrap: break-word;
    }

    .bg-black-cell {
      background-color: #000000 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-10">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 mb-6 shadow-lg no-print">
    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-amber-400 text-slate-900 p-2.5 rounded-xl font-black text-xl">
          <i class="fa-solid fa-trophy"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white">Generador de Planillas Oficiales</h1>
          <p class="text-xs text-slate-400">Estructura adaptativa para 3 y 4 parejas en A4 Horizontal</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <div class="flex items-center bg-slate-900 border border-slate-700 rounded-lg p-1 text-xs">
          <label class="text-slate-400 px-2 font-semibold">Exportar:</label>
          <select id="exportScope" class="bg-slate-800 text-white font-bold py-1 px-2 rounded focus:outline-none">
            <option value="all">Todas las Zonas</option>
            <option value="current">Solo Zona Activa</option>
          </select>
        </div>

        <button onclick="exportPDF()" id="btnExportPDF" class="bg-red-600 hover:bg-red-500 text-white px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 transition shadow">
          <i class="fa-solid fa-file-pdf"></i> Descargar PDF
        </button>
        <button onclick="exportPNG()" id="btnExportPNG" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 transition shadow">
          <i class="fa-solid fa-file-image"></i> Descargar PNG
        </button>
        <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 text-white px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-print"></i> Imprimir
        </button>
      </div>
    </div>
  </header>

  <!-- Notificación interna -->
  <div id="toastMsg" class="fixed bottom-4 right-4 z-50 hidden bg-slate-800 border border-amber-400 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-semibold flex items-center gap-2 no-print">
    <i class="fa-solid fa-circle-check text-amber-400"></i>
    <span id="toastText">Listo</span>
  </div>

  <main id="mainContainer" class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Panel Lateral -->
    <div class="lg:col-span-4 flex flex-col gap-5 no-print">
      
      <!-- Carga Rápida -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-md">
        <h2 class="text-sm font-bold text-amber-400 mb-1 flex items-center gap-2">
          <i class="fa-solid fa-file-csv"></i> Carga Rápida
        </h2>
        <p class="text-xs text-slate-400 mb-2">
          Pegá el texto transcripto para generar automáticamente todas las zonas.
        </p>
        <textarea id="csvInput" rows="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 font-mono focus:outline-none focus:border-amber-400" placeholder="TORNEO: PUNTO DE ORO&#10;CATEGORIA: 6+7&#10;ZONA: A&#10;Pilar Gianfrancesco - Pablo Gascue&#10;Pareja 2&#10;Pareja 3"></textarea>
        
        <button onclick="processCSVText()" class="w-full mt-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 px-3 rounded-lg text-xs transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-bolt"></i> Cargar Todas las Zonas
        </button>
      </div>

      <!-- Pestañas de Zonas -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-md">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-xs font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-layer-group text-amber-400"></i> Zonas Creadas
          </h2>
          <div class="flex items-center gap-1.5">
            <button onclick="deleteCurrentZone()" id="btnDeleteZone" class="bg-red-900/50 hover:bg-red-800 text-red-200 px-2 py-0.5 rounded text-xs transition" title="Eliminar zona activa">
              <i class="fa-solid fa-trash-can"></i>
            </button>
            <button onclick="addNewZone()" class="bg-slate-700 hover:bg-slate-600 text-white px-2 py-0.5 rounded text-xs transition">
              + Nueva
            </button>
          </div>
        </div>
        <div id="zoneTabs" class="flex flex-wrap gap-1.5"></div>
      </div>

      <!-- Edición Manual -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-md">
        <h2 class="text-xs font-bold text-white mb-2 flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-amber-400"></i> Datos de la Zona Activa
        </h2>
        
        <div class="space-y-2 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">Nombre del Torneo / Club</label>
            <input type="text" id="inputClub" oninput="updateCurrentZoneData()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-400 mb-1">Categoría</label>
              <input type="text" id="inputCat" oninput="updateCurrentZoneData()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white">
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Zona</label>
              <input type="text" id="inputZone" oninput="updateCurrentZoneData()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white">
            </div>
          </div>

          <div class="pt-2">
            <div class="flex justify-between items-center mb-1">
              <label class="block text-slate-400 font-bold">Parejas Jugadoras</label>
              <button onclick="toggle4thPair()" id="btnToggle4th" class="text-[11px] bg-slate-700 hover:bg-slate-600 text-amber-300 px-2 py-0.5 rounded transition">
                + 4ta Pareja
              </button>
            </div>
            <div id="pairsInputs" class="space-y-1.5"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Vista Previa de la Planilla A4 -->
    <div class="lg:col-span-8 flex flex-col items-center">
      <div class="w-full flex justify-between items-center mb-2 px-1 no-print">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Vista Previa Hoja A4</span>
        <span class="text-xs text-amber-400"><i class="fa-solid fa-info-circle"></i> Podés hacer clic en las celdas para editar texto.</span>
      </div>

      <div id="previewContainer" class="w-full flex justify-center bg-slate-950/50 p-6 rounded-xl border border-slate-800 shadow-inner overflow-x-auto">
        <div id="previewArea" class="sheet-canvas shadow-2xl"></div>
      </div>
    </div>

  </main>

  <!-- Contenedor oculto para exportar múltiples zonas -->
  <div id="exportStaging" style="position: fixed; left: -9999px; top: 0; width: 850px; background: #fff;"></div>

  <script>
    (function() {
      var zones = [
        {
          id: 'A',
          club: 'PUNTO DE ORO',
          category: '5+6',
          zone: 'A',
          pairs: [
            'Micaela Lacaze - Gustavo Lacaze',
            'Celeste Tondi - Alejandro Tondi',
            'Micaela Madrid - Daniel Razani'
          ],
          fixture: [
            { match: '1 vs 2', day: 'SÁBADO', time: '21HS' },
            { match: '2 vs 3', day: 'VIERNES', time: '20HS' },
            { match: '1 vs 3', day: 'SÁBADO', time: '17HS' }
          ]
        }
      ];

      var activeZoneIndex = 0;

      function showToast(message, isError) {
        var toast = document.getElementById('toastMsg');
        var text = document.getElementById('toastText');
        if (!toast || !text) return;
        text.textContent = message;
        toast.classList.remove('hidden');
        if (isError) {
          toast.classList.remove('border-amber-400');
          toast.classList.add('border-red-500');
        } else {
          toast.classList.remove('border-red-500');
          toast.classList.add('border-amber-400');
        }
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(function() {
          toast.classList.add('hidden');
        }, 3500);
      }

      function escapeHtmlAttr(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function renderZoneTabs() {
        var container = document.getElementById('zoneTabs');
        if (!container) return;
        container.innerHTML = zones.map(function(z, idx) {
          var count = z.pairs ? z.pairs.filter(function(p) { return p && p.trim(); }).length : 0;
          return '<button onclick="switchZone(' + idx + ')" class="px-2.5 py-1 rounded text-xs font-bold transition ' + (activeZoneIndex === idx ? 'bg-amber-400 text-slate-950' : 'bg-slate-700 text-slate-300 hover:bg-slate-600') + '">Zona ' + (z.zone || '') + ' (' + count + ')</button>';
        }).join('');

        var delBtn = document.getElementById('btnDeleteZone');
        if (delBtn) {
          delBtn.style.display = zones.length > 1 ? 'inline-block' : 'none';
        }
      }

      function switchZone(idx) {
        if (idx < 0 || idx >= zones.length) return;
        activeZoneIndex = idx;
        renderZoneTabs();
        loadZoneData(idx);
      }

      function addNewZone() {
        var nextLetter = String.fromCharCode(65 + zones.length);
        zones.push({
          id: nextLetter,
          club: (zones[0] && zones[0].club) ? zones[0].club : 'PUNTO DE ORO',
          category: (zones[0] && zones[0].category) ? zones[0].category : '5+6',
          zone: nextLetter,
          pairs: ['', '', ''],
          fixture: []
        });
        switchZone(zones.length - 1);
      }

      function deleteCurrentZone() {
        if (zones.length <= 1) return;
        zones.splice(activeZoneIndex, 1);
        if (activeZoneIndex >= zones.length) {
          activeZoneIndex = zones.length - 1;
        }
        switchZone(activeZoneIndex);
        showToast('Zona eliminada');
      }

      function toggle4thPair() {
        var z = zones[activeZoneIndex];
        if (!z) return;
        if (!z.pairs) z.pairs = ['', '', ''];

        if (z.pairs.length >= 4) {
          z.pairs = z.pairs.slice(0, 3);
        } else {
          while (z.pairs.length < 4) z.pairs.push('');
        }
        z.fixture = [];
        loadZoneData(activeZoneIndex);
        renderZoneTabs();
      }

      function loadZoneData(idx) {
        var z = zones[idx];
        if (!z) return;

        var clubElem = document.getElementById('inputClub');
        var catElem = document.getElementById('inputCat');
        var zoneElem = document.getElementById('inputZone');
        var btn4th = document.getElementById('btnToggle4th');

        if (clubElem) clubElem.value = z.club || '';
        if (catElem) catElem.value = z.category || '';
        if (zoneElem) zoneElem.value = z.zone || '';

        if (!z.pairs || z.pairs.length < 3) {
          z.pairs = z.pairs ? z.pairs.slice() : [];
          while (z.pairs.length < 3) z.pairs.push('');
        }

        if (btn4th) {
          btn4th.textContent = z.pairs.length >= 4 ? '- Quitar 4ta' : '+ 4ta Pareja';
        }

        renderPairsInputs(z.pairs);
        renderSheetHTML(document.getElementById('previewArea'), z);
      }

      function renderPairsInputs(pairs) {
        var container = document.getElementById('pairsInputs');
        if (!container) return;
        var safe = pairs.slice();

        container.innerHTML = safe.map(function(p, i) {
          return '<div class="flex items-center gap-1.5">' +
            '<span class="text-slate-500 font-bold w-4 text-xs">' + (i + 1) + '</span>' +
            '<input type="text" value="' + escapeHtmlAttr(p) + '" oninput="updatePair(' + i + ', this.value)" placeholder="Jugador 1 - Jugador 2" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-xs text-white">' +
          '</div>';
        }).join('');
      }

      function updatePair(pairIndex, value) {
        zones[activeZoneIndex].pairs[pairIndex] = value;
        renderZoneTabs();
        renderSheetHTML(document.getElementById('previewArea'), zones[activeZoneIndex]);
      }

      function updateCurrentZoneData() {
        var z = zones[activeZoneIndex];
        if (!z) return;

        var clubElem = document.getElementById('inputClub');
        var catElem = document.getElementById('inputCat');
        var zoneElem = document.getElementById('inputZone');

        if (clubElem) z.club = clubElem.value;
        if (catElem) z.category = catElem.value;
        if (zoneElem) z.zone = zoneElem.value;

        renderZoneTabs();
        renderSheetHTML(document.getElementById('previewArea'), z);
      }

      function renderSheetHTML(targetElement, z) {
        if (!targetElement || !z) return;

        var allPairs = z.pairs || [];
        var validPairs = allPairs.filter(function(p) { return p && p.trim().length > 0; });
        var is4Pairs = validPairs.length > 3 || allPairs.length >= 4;
        var numRows = is4Pairs ? 4 : 3;

        var safePairs = allPairs.slice();
        while (safePairs.length < numRows) safePairs.push('');

        var defaultMatchNames = is4Pairs 
          ? ['1 vs 4', '2 vs 3', 'G vs G', 'P vs P']
          : ['1 vs 2', '2 vs 3', '1 vs 3'];

        var defaultFixture = is4Pairs
          ? [
              { match: '1 vs 4', day: 'VIERNES', time: '20HS' },
              { match: '2 vs 3', day: 'SÁBADO', time: '16HS' },
              { match: 'G vs G', day: 'SÁBADO', time: '18HS' },
              { match: 'P vs P', day: 'SÁBADO', time: '19HS' }
            ]
          : [
              { match: '1 vs 2', day: 'SÁBADO', time: '21HS' },
              { match: '2 vs 3', day: 'VIERNES', time: '20HS' },
              { match: '1 vs 3', day: 'SÁBADO', time: '17HS' }
            ];

        var fixtureRows = [];
        for (var k = 0; k < numRows; k++) {
          if (z.fixture && z.fixture[k]) {
            fixtureRows.push(z.fixture[k]);
          } else {
            fixtureRows.push(defaultFixture[k]);
          }
        }

        var jugWidth = is4Pairs ? '38%' : '43%';
        var colWidth = '5%';

        var rowsHTML = safePairs.slice(0, numRows).map(function(p, i) {
          return '<tr style="height: 38px;">' +
            '<td style="font-size: 13px;">' + (i + 1) + '</td>' +
            '<td style="text-align: left; padding-left: 10px; font-size: 13px; font-weight: 700;" contenteditable="true">' + (p || '') + '</td>' +
            '<td class="' + (i === 0 ? 'bg-black-cell' : '') + '" contenteditable="' + (i !== 0) + '"></td>' +
            '<td class="' + (i === 1 ? 'bg-black-cell' : '') + '" contenteditable="' + (i !== 1) + '"></td>' +
            '<td class="' + (i === 2 ? 'bg-black-cell' : '') + '" contenteditable="' + (i !== 2) + '"></td>' +
            (is4Pairs ? '<td class="' + (i === 3 ? 'bg-black-cell' : '') + '" contenteditable="' + (i !== 3) + '"></td>' : '') +
            '<td contenteditable="true"></td>' +
            '<td contenteditable="true"></td>' +
            '<td contenteditable="true"></td>' +
            '<td contenteditable="true"></td>' +
          '</tr>';
        }).join('');

        var fixtureHTML = fixtureRows.slice(0, numRows).map(function(f, i) {
          var finalMatchName = is4Pairs ? (defaultMatchNames[i] || f.match) : (f.match || defaultMatchNames[i]);

          return '<tr style="height: 30px;">' +
            '<td style="text-transform: uppercase;" contenteditable="true">' + (z.club || 'PUNTO DE ORO') + '</td>' +
            '<td contenteditable="true">' + finalMatchName + '</td>' +
            '<td style="text-transform: uppercase;" contenteditable="true">' + (f.day || '') + '</td>' +
            '<td contenteditable="true">' + (f.time || '') + '</td>' +
            '<td contenteditable="true"></td>' +
          '</tr>';
        }).join('');

        targetElement.innerHTML = '' +
          '<!-- Cabecera de la Planilla -->' +
          '<table class="sheet-table">' +
            '<tr>' +
              '<td style="width: 55%; font-size: 18px; text-transform: uppercase; padding: 10px;" contenteditable="true">' + (z.club || 'PUNTO DE ORO') + '</td>' +
              '<td style="width: 25%; font-size: 15px; text-transform: uppercase; padding: 10px;" contenteditable="true">CAT: ' + (z.category || '') + '</td>' +
              '<td style="width: 20%; font-size: 16px; text-transform: uppercase; background-color: #f1f5f9; padding: 10px;" contenteditable="true">ZONA ' + (z.zone || '') + '</td>' +
            '</tr>' +
          '</table>' +

          '<!-- Tabla Principal de Posiciones y Cruces -->' +
          '<table class="sheet-table" style="border-top: none;">' +
            '<colgroup>' +
              '<col style="width: 5%;">' +
              '<col style="width: ' + jugWidth + ';">' +
              '<col style="width: ' + colWidth + ';">' +
              '<col style="width: ' + colWidth + ';">' +
              '<col style="width: ' + colWidth + ';">' +
              (is4Pairs ? '<col style="width: ' + colWidth + ';">' : '') +
              '<col style="width: 8%;">' +
              '<col style="width: 8%;">' +
              '<col style="width: 8%;">' +
              '<col style="width: 8%;">' +
            '</colgroup>' +
            '<thead style="background-color: #f1f5f9;">' +
              '<tr style="height: 34px;">' +
                '<th>N°</th>' +
                '<th>JUGADORES</th>' +
                '<th>1</th>' +
                '<th>2</th>' +
                '<th>3</th>' +
                (is4Pairs ? '<th>4</th>' : '') +
                '<th>PTS</th>' +
                '<th>SETS</th>' +
                '<th>GAMES</th>' +
                '<th>POS</th>' +
              '</tr>' +
            '</thead>' +
            '<tbody>' +
              rowsHTML +
            '</tbody>' +
          '</table>' +

          '<!-- Sección Inferior: Fixture al 100% del ancho -->' +
          '<div style="padding: 12px; border-top: 1.5px solid #000000;">' +
            '<table class="sheet-table" style="width: 100%;">' +
              '<thead style="background-color: #f1f5f9;">' +
                '<tr style="height: 28px;">' +
                  '<th style="width: 30%;">SEDE / CLUB</th>' +
                  '<th style="width: 16%;">PARTIDO</th>' +
                  '<th style="width: 18%;">DÍA</th>' +
                  '<th style="width: 14%;">HORA</th>' +
                  '<th style="width: 22%;">RESULTADO</th>' +
                '</tr>' +
              '</thead>' +
              '<tbody>' +
                fixtureHTML +
              '</tbody>' +
            '</table>' +
          '</div>';
      }

      function processCSVText() {
        var input = document.getElementById('csvInput');
        if (!input || !input.value.trim()) {
          showToast('Pegá el texto de las zonas primero', true);
          return;
        }

        var lines = input.value.split(/\r?\n/).map(function(l) { return l.trim(); }).filter(Boolean);
        var parsedZones = [];
        var currentClub = (zones[0] && zones[0].club) ? zones[0].club : 'PUNTO DE ORO';
        var currentCat = (zones[0] && zones[0].category) ? zones[0].category : '';
        var currentZone = null;

        lines.forEach(function(line) {
          var upper = line.toUpperCase();

          if (upper.startsWith('TORNEO:') || upper.startsWith('CLUB:')) {
            currentClub = line.split(':').slice(1).join(':').trim();
            if (currentZone && currentZone.pairs.length === 0) {
              currentZone.club = currentClub;
            }
          } else if (upper.startsWith('CATEGORIA:') || upper.startsWith('CATEGORÍA:') || upper.startsWith('CAT:')) {
            currentCat = line.split(':').slice(1).join(':').trim();
            if (currentZone && currentZone.pairs.length === 0) {
              currentZone.category = currentCat;
            }
          } else if (upper.startsWith('ZONA')) {
            if (currentZone) parsedZones.push(currentZone);
            var zLabel = line.replace(/^ZONA\s*:?\s*/i, '').trim() || String.fromCharCode(65 + parsedZones.length);
            currentZone = {
              id: zLabel,
              club: currentClub,
              category: currentCat,
              zone: zLabel,
              pairs: [],
              fixture: []
            };
          } else {
            if (!currentZone) {
              currentZone = {
                id: 'A',
                club: currentClub,
                category: currentCat,
                zone: 'A',
                pairs: [],
                fixture: []
              };
            }

            var matchPattern = /^(\d\s*vs\s*\d|[GP]\s*vs\s*[GP])/i;
            if (matchPattern.test(line)) {
              var parts = line.split(/[\|\t;]+/);
              if (parts.length >= 2) {
                currentZone.fixture.push({
                  match: (parts[0] || '').trim(),
                  day: (parts[1] || '').trim(),
                  time: (parts[2] || '').trim()
                });
              } else {
                var mMatch = line.match(matchPattern);
                var rest = line.replace(matchPattern, '').replace(/^[\s\-:]+/, '').trim();
                var tokens = rest.split(/\s+/);
                currentZone.fixture.push({
                  match: mMatch ? mMatch[0] : '',
                  day: tokens[0] || '',
                  time: tokens.slice(1).join(' ') || ''
                });
              }
            } else {
              var cleanPair = line.replace(/^\d+[\.\-\)]\s*/, '').trim();
              if (cleanPair) {
                currentZone.pairs.push(cleanPair);
              }
            }
          }
        });

        if (currentZone) parsedZones.push(currentZone);

        if (parsedZones.length > 0) {
          zones = parsedZones;
          switchZone(0);
          showToast('Se cargaron ' + parsedZones.length + ' zona(s) correctamente');
        }
      }

      async function exportPDF() {
        if (typeof window.html2canvas === 'undefined' || typeof window.jspdf === 'undefined') {
          showToast('Las librerías de PDF aún están cargando. Intentá en unos segundos.', true);
          return;
        }

        var btn = document.getElementById('btnExportPDF');
        if (btn) btn.disabled = true;
        showToast('Generando PDF...');

        try {
          var scope = document.getElementById('exportScope').value;
          var targetZones = (scope === 'current') ? [zones[activeZoneIndex]] : zones;
          var jsPDF = window.jspdf.jsPDF;
          var pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
          var staging = document.getElementById('exportStaging');

          for (var i = 0; i < targetZones.length; i++) {
            var el = document.createElement('div');
            el.className = 'sheet-canvas';

            if (scope === 'current') {
              el.innerHTML = document.getElementById('previewArea').innerHTML;
            } else {
              renderSheetHTML(el, targetZones[i]);
            }

            staging.innerHTML = '';
            staging.appendChild(el);

            var canvas = await window.html2canvas(el, {
              scale: 2,
              backgroundColor: '#ffffff',
              useCORS: true
            });
            var imgData = canvas.toDataURL('image/png');

            if (i > 0) pdf.addPage();
            var pdfWidth = pdf.internal.pageSize.getWidth();
            var pdfHeight = pdf.internal.pageSize.getHeight();
            var margin = 10;
            var usableWidth = pdfWidth - margin * 2;
            var imgHeight = (canvas.height * usableWidth) / canvas.width;

            if (imgHeight > pdfHeight - margin * 2) {
              imgHeight = pdfHeight - margin * 2;
              usableWidth = (canvas.width * imgHeight) / canvas.height;
            }

            var offsetX = (pdfWidth - usableWidth) / 2;
            pdf.addImage(imgData, 'PNG', offsetX, 12, usableWidth, imgHeight);
          }

          staging.innerHTML = '';
          var fileName = scope === 'current'
            ? 'Planilla_Zona_' + (zones[activeZoneIndex].zone || 'A') + '.pdf'
            : 'Planillas_Torneo.pdf';
          pdf.save(fileName);
          showToast('PDF descargado');
        } catch (err) {
          console.error(err);
          showToast('Error al generar el PDF: ' + (err.message || 'desconocido'), true);
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      async function exportPNG() {
        if (typeof window.html2canvas === 'undefined') {
          showToast('La librería de captura aún está cargando. Intentá en unos segundos.', true);
          return;
        }

        var btn = document.getElementById('btnExportPNG');
        if (btn) btn.disabled = true;
        showToast('Generando PNG...');

        try {
          var scope = document.getElementById('exportScope').value;
          var targetZones = (scope === 'current') ? [zones[activeZoneIndex]] : zones;
          var staging = document.getElementById('exportStaging');

          for (var i = 0; i < targetZones.length; i++) {
            var el = document.createElement('div');
            el.className = 'sheet-canvas';

            if (scope === 'current') {
              el.innerHTML = document.getElementById('previewArea').innerHTML;
            } else {
              renderSheetHTML(el, targetZones[i]);
            }

            staging.innerHTML = '';
            staging.appendChild(el);

            var canvas = await window.html2canvas(el, {
              scale: 2,
              backgroundColor: '#ffffff',
              useCORS: true
            });
            var link = document.createElement('a');
            link.download = 'Planilla_Zona_' + (targetZones[i].zone || (i + 1)) + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
          }

          staging.innerHTML = '';
          showToast('PNG descargado');
        } catch (err) {
          console.error(err);
          showToast('Error al generar el PNG: ' + (err.message || 'desconocido'), true);
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      // Exponer funciones globalmente en window
      window.switchZone = switchZone;
      window.addNewZone = addNewZone;
      window.deleteCurrentZone = deleteCurrentZone;
      window.toggle4thPair = toggle4thPair;
      window.updatePair = updatePair;
      window.updateCurrentZoneData = updateCurrentZoneData;
      window.processCSVText = processCSVText;
      window.exportPDF = exportPDF;
      window.exportPNG = exportPNG;

      // Inicialización segura inmediata y en eventos del ciclo de vida del documento
      function initApp() {
        try {
          switchZone(0);
        } catch (e) {
          console.error('Error al inicializar la planilla:', e);
        }
      }

      initApp();

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      }
      window.addEventListener('load', initApp);
    })();
  </script>
</body>
