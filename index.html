<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Planillas Oficiales</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @media print {
      body { background: white !important; color: black !important; padding: 0 !important; }
      .no-print { display: none !important; }
    }

    .sheet-canvas {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      box-sizing: border-box;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    }

    .sheet-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .sheet-table th, .sheet-table td {
      border: 1.5px solid #000000;
      text-align: center;
      vertical-align: middle;
      font-weight: 700;
      color: #000000;
      padding: 6px 4px;
      font-size: 13px;
      line-height: 1.2;
    }

    .bg-black-cell {
      background-color: #000000 !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-10">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 mb-6 shadow-lg no-print">
    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-amber-400 text-slate-900 p-2.5 rounded-xl font-black text-xl">
          <i class="fa-solid fa-trophy"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white">Generador de Planillas Oficiales</h1>
          <p class="text-xs text-slate-400">Estructura adaptativa para 3 y 4 parejas en A4 Horizontal</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <div class="flex items-center bg-slate-900 border border-slate-700 rounded-lg p-1 text-xs">
          <label class="text-slate-400 px-2 font-semibold">Exportar:</label>
          <select id="exportScope" class="bg-slate-800 text-white font-bold py-1 px-2 rounded focus:outline-none">
            <option value="all">Todas las Zonas</option>
            <option value="current">Solo Zona Activa</option>
          </select>
        </div>

        <button onclick="exportPDF()" class="bg-red-600 hover:bg-red-500 text-white px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 transition shadow">
          <i class="fa-solid fa-file-pdf"></i> Descargar PDF
        </button>
        <button onclick="exportPNG()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 transition shadow">
          <i class="fa-solid fa-file-image"></i> Descargar PNG
        </button>
        <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 text-white px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-print"></i> Imprimir
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-6 no-print">

    <!-- Panel Lateral -->
    <div class="lg:col-span-4 flex flex-col gap-5">
      
      <!-- Carga Rápida -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-md">
        <h2 class="text-sm font-bold text-amber-400 mb-1 flex items-center gap-2">
          <i class="fa-solid fa-file-csv"></i> Carga Rápida
        </h2>
        <p class="text-xs text-slate-400 mb-2">
          Pegá el texto transcripto para generar automáticamente todas las zonas.
        </p>
        <textarea id="csvInput" rows="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 font-mono focus:outline-none focus:border-amber-400" placeholder="TORNEO: PUNTO DE ORO&#10;CATEGORIA: 6+7&#10;ZONA: A&#10;Pilar Gianfrancesco - Pablo Gascue..."></textarea>
        
        <button onclick="processCSVText()" class="w-full mt-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 px-3 rounded-lg text-xs transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-bolt"></i> Cargar Todas las Zonas
        </button>
      </div>

      <!-- Pestañas de Zonas -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-md">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-xs font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-layer-group text-amber-400"></i> Zonas Creadas
          </h2>
          <button onclick="addNewZone()" class="bg-slate-700 hover:bg-slate-600 text-white px-2 py-0.5 rounded text-xs transition">
            + Nueva
          </button>
        </div>
        <div id="zoneTabs" class="flex flex-wrap gap-1.5">
          <!-- Dinámico -->
        </div>
      </div>

      <!-- Edición Manual -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-md">
        <h2 class="text-xs font-bold text-white mb-2 flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-amber-400"></i> Datos de la Zona Activa
        </h2>
        
        <div class="space-y-2 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">Nombre del Torneo / Club</label>
            <input type="text" id="inputClub" oninput="updateCurrentZoneData()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-400 mb-1">Categoría</label>
              <input type="text" id="inputCat" oninput="updateCurrentZoneData()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white">
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Zona</label>
              <input type="text" id="inputZone" oninput="updateCurrentZoneData()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white">
            </div>
          </div>

          <div class="pt-2">
            <label class="block text-slate-400 mb-1 font-bold">Parejas Jugadoras</label>
            <div id="pairsInputs" class="space-y-1.5">
              <!-- Dinámico -->
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Vista Previa de la Planilla A4 -->
    <div class="lg:col-span-8 flex flex-col items-center">
      <div class="w-full flex justify-between items-center mb-2 px-1">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Vista Previa Hoja A4</span>
        <span class="text-xs text-amber-400"><i class="fa-solid fa-info-circle"></i> Podés hacer clic en las celdas para editar texto.</span>
      </div>

      <div class="w-full flex justify-center bg-slate-950/50 p-6 rounded-xl border border-slate-800 shadow-inner">
        <div id="previewArea" class="sheet-canvas shadow-2xl">
          <!-- Render dinámico -->
        </div>
      </div>
    </div>

  </main>

  <script>
    var zones = [
      {
        id: 'A',
        club: 'PUNTO DE ORO',
        category: '5+6',
        zone: 'A',
        pairs: [
          'Micaela Lacaze - Gustavo Lacaze',
          'Celeste Tondi - Alejandro Tondi',
          'Micaela Madrid - Daniel Razani'
        ],
        fixture: [
          { match: '1 vs 2', day: 'SÁBADO', time: '21HS' },
          { match: '2 vs 3', day: 'VIERNES', time: '20HS' },
          { match: '1 vs 3', day: 'SÁBADO', time: '17HS' }
        ]
      }
    ];

    var activeZoneIndex = 0;

    function renderZoneTabs() {
      var container = document.getElementById('zoneTabs');
      if (!container) return;
      container.innerHTML = zones.map(function(z, idx) {
        var count = z.pairs ? z.pairs.filter(function(p) { return p && p.trim(); }).length : 0;
        return '<button onclick="switchZone(' + idx + ')" class="px-2.5 py-1 rounded text-xs font-bold transition ' + (activeZoneIndex === idx ? 'bg-amber-400 text-slate-950' : 'bg-slate-700 text-slate-300 hover:bg-slate-600') + '">Zona ' + z.zone + ' (' + count + ')</button>';
      }).join('');
    }

    function switchZone(idx) {
      if (idx < 0 || idx >= zones.length) return;
      activeZoneIndex = idx;
      renderZoneTabs();
      loadZoneData(idx);
    }

    function addNewZone() {
      var nextLetter = String.fromCharCode(65 + zones.length);
      zones.push({
        id: nextLetter,
        club: (zones[0] && zones[0].club) ? zones[0].club : 'PUNTO DE ORO',
        category: (zones[0] && zones[0].category) ? zones[0].category : '5+6',
        zone: nextLetter,
        pairs: ['', '', ''],
        fixture: []
      });
      switchZone(zones.length - 1);
    }

    function loadZoneData(idx) {
      var z = zones[idx];
      if (!z) return;

      var clubElem = document.getElementById('inputClub');
      var catElem = document.getElementById('inputCat');
      var zoneElem = document.getElementById('inputZone');

      if (clubElem) clubElem.value = z.club || '';
      if (catElem) catElem.value = z.category || '';
      if (zoneElem) zoneElem.value = z.zone || '';

      renderPairsInputs(z.pairs || []);
      renderSheetHTML(document.getElementById('previewArea'), z);
    }

    function renderPairsInputs(pairs) {
      var container = document.getElementById('pairsInputs');
      if (!container) return;
      var safe = pairs.slice();

      container.innerHTML = safe.map(function(p, i) {
        return '<div class="flex items-center gap-1.5"><span class="text-slate-500 font-bold w-4 text-xs">' + (i + 1) + '</span><input type="text" value="' + (p || '') + '" oninput="updatePair(' + i + ', this.value)" placeholder="Jugador 1 - Jugador 2" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-xs text-white"></div>';
      }).join('');
    }

    function updatePair(pairIndex, value) {
      zones[activeZoneIndex].pairs[pairIndex] = value;
      renderSheetHTML(document.getElementById('previewArea'), zones[activeZoneIndex]);
    }

    function updateCurrentZoneData() {
      var z = zones[activeZoneIndex];
      if (!z) return;

      var clubElem = document.getElementById('inputClub');
      var catElem = document.getElementById('inputCat');
      var zoneElem = document.getElementById('inputZone');

      if (clubElem) z.club = clubElem.value;
      if (catElem) z.category = catElem.value;
      if (zoneElem) z.zone = zoneElem.value;

      renderZoneTabs();
      renderSheetHTML(document.getElementById('previewArea'), z);
    }

    function renderSheetHTML(targetElement, z) {
      if (!targetElement || !z) return;

      var validPairs = (z.pairs || []).filter(function(p) { return p && p.trim().length > 0; });
      var is4Pairs = validPairs.length > 3;
      var numRows = is4Pairs ? 4 : 3;

      var safePairs = validPairs.slice();
      while (safePairs.length < numRows) safePairs.push('');

      var defaultFixture = is4Pairs
        ? [
            { match: '1 vs 4', day: 'VIERNES', time: '20HS' },
            { match: '2 vs 3', day: 'SÁBADO', time: '16HS' },
            { match: 'G vs G', day: 'SÁBADO', time: '18HS' },
            { match: 'P vs P', day: 'SÁBADO', time: '19HS' }
          ]
        : [
            { match: '1 vs 2', day: 'SÁBADO', time: '21HS' },
            { match: '2 vs 3', day: 'VIERNES', time: '20HS' },
            { match: '1 vs 3', day: 'SÁBADO', time: '17HS' }
          ];

      var fixtureRows = (z.fixture && z.fixture.length > 0) ? z.fixture : defaultFixture;
      var jugWidth = is4Pairs ? '38%' : '43%';
      var colWidth = '5%';

      var rowsHTML = safePairs.slice(0, numRows).map(function(p, i) {
        return '<tr>' +
          '<td style="font-size: 13px;">' + (i + 1) + '</td>' +
          '<td style="text-align: left; padding-left: 10px; font-size: 13px; font-weight: 700;" contenteditable="true">' + (p || '') + '</td>' +
          '<td class="' + (i === 0 ? 'bg-black-cell' : '') + '" contenteditable="' + (i !== 0) + '"></td>' +
          '<td class="' + (i === 1 ? 'bg-black-cell' : '') + '" contenteditable="' + (i !== 1) + '"></td>' +
          '<td class="' + (i === 2 ? 'bg-black-cell' : '') + '" contenteditable="' + (i !== 2) + '"></td>' +
          (is4Pairs ? '<td class="' + (i === 3 ? 'bg-black-cell' : '') + '" contenteditable="' + (i !== 3) + '"></td>' : '') +
          '<td contenteditable="true"></td>' +
          '<td contenteditable="true"></td>' +
          '<td contenteditable="true"></td>' +
          '<td contenteditable="true"></td>' +
        '</tr>';
      }).join('');

      var fixtureHTML = fixtureRows.slice(0, numRows).map(function(f) {
        return '<tr>' +
          '<td style="text-transform: uppercase;" contenteditable="true">' + (z.club || 'PUNTO DE ORO') + '</td>' +
          '<td contenteditable="true">' + (f.match || '') + '</td>' +
          '<td style="text-transform: uppercase;" contenteditable="true">' + (f.day || '') + '</td>' +
          '<td contenteditable="true">' + (f.time || '') + '</td>' +
          '<td contenteditable="true"></td>' +
        '</tr>';
      }).join('');

      targetElement.innerHTML = '<div class="w-full bg-white">' +
        '<div style="font-size: 24px; font-weight: 900; text-align: center; padding: 8px 0; text-transform: uppercase; border-bottom: 2px solid #000;" contenteditable="true">' + (z.club || 'PUNTO DE ORO') + '</div>' +
        '<div style="display: flex; border-bottom: 2px solid #000; font-size: 14px; font-weight: 700;">' +
          '<div style="flex: 1; padding: 5px 10px; border-right: 2px solid #000; text-align: left;">CATEGORIA: <span contenteditable="true" style="font-size: 15px; margin-left: 4px;">' + (z.category || '5+6') + '</span></div>' +
          '<div style="flex: 1; padding: 5px 10px; text-align: center;">ZONA: <span contenteditable="true" style="font-size: 15px; margin-left: 4px;">' + (z.zone || 'A') + '</span></div>' +
        '</div>' +
        '<table class="sheet-table"><thead><tr style="font-size: 12px;"><th style="width: 5%;">N°</th><th style="width: ' + jugWidth + '; text-align: left; padding-left: 10px;">JUGADORES</th><th style="width: ' + colWidth + ';">1</th><th style="width: ' + colWidth + ';">2</th><th style="width: ' + colWidth + ';">3</th>' + (is4Pairs ? '<th style="width: ' + colWidth + ';">4</th>' : '') + '<th style="width: 9%;">PTOS.</th><th style="width: 9%;">SETS</th><th style="width: 10%;">GAMES</th><th style="width: 9%;">POS.</th></tr></thead><tbody>' + rowsHTML + '</tbody></table>' +
        '<table class="sheet-table" style="border-top: none;"><thead><tr style="font-size: 12px;"><th style="width: 37%;">COMPLEJO</th><th style="width: 18%;">PARTIDO</th><th style="width: 15%;">DIA</th><th style="width: 12%;">HORA</th><th style="width: 18%;">RESULTADO</th></tr></thead><tbody>' + fixtureHTML + '</tbody></table>' +
      '</div>';
    }

    function processCSVText() {
      var csvElem = document.getElementById('csvInput');
      if (!csvElem) return;
      var raw = csvElem.value.trim();
      if (!raw) return;

      var lines = raw.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l; });
      var parsedZones = [];
      var currentClub = 'PUNTO DE ORO';
      var currentCategory = '';
      var currentZoneObj = null;

      lines.forEach(function(line) {
        var uLine = line.toUpperCase();

        if (uLine.indexOf('TORNEO:') === 0) {
          currentClub = line.split(':')[1].trim();
        } else if (uLine.indexOf('CATEGORIA:') === 0 || uLine.indexOf('CATEGORÍA:') === 0) {
          currentCategory = line.split(':')[1].trim();
        } else if (uLine.indexOf('ZONA') !== -1) {
          var zoneMatch = line.match(/ZONA[\s:]*([A-Za-z0-9]+)/i);
          var zoneLetter = zoneMatch ? zoneMatch[1].toUpperCase() : 'A';

          currentZoneObj = {
            id: zoneLetter,
            club: currentClub,
            category: currentCategory || '5+6',
            zone: zoneLetter,
            pairs: [],
            fixture: []
          };
          parsedZones.push(currentZoneObj);
        } else if (line.indexOf('|') !== -1 || uLine.indexOf('VS') !== -1 || uLine.indexOf('HS') !== -1) {
          if (currentZoneObj) {
            var parts = line.split('|').map(function(p) { return p.trim(); });
            if (parts.length >= 3) {
              currentZoneObj.fixture.push({
                match: parts[0],
                day: parts[1],
                time: parts[2]
              });
            } else {
              var matchMatch = line.match(/(\d\s*vs\s*\d|[GP]\s*vs\s*[GP])/i);
              var dayMatch = line.match(/(JUE|VIE|SAB|SÁB|DOM|LUN|MAR|MIE|MIÉ)/i);
              var timeMatch = line.match(/(\d{1,2}(:\d{2})?\s*HS)/i);

              if (matchMatch) {
                currentZoneObj.fixture.push({
                  match: matchMatch[0].toUpperCase(),
                  day: dayMatch ? dayMatch[0].toUpperCase() : '',
                  time: timeMatch ? timeMatch[0].toLowerCase() : ''
                });
              }
            }
          }
        } else if (line.indexOf('-') !== -1 && uLine.indexOf('---') !== 0 && uLine.indexOf('###') !== 0) {
          var cleanPair = line.replace(/^\d+[\.\,-]?\s*/, '').trim();
          if (currentZoneObj) {
            currentZoneObj.pairs.push(cleanPair);
          } else {
            currentZoneObj = {
              id: 'A',
              club: currentClub,
              category: currentCategory || '5+6',
              zone: 'A',
              pairs: [cleanPair],
              fixture: []
            };
            parsedZones.push(currentZoneObj);
          }
        }
      });

      if (parsedZones.length > 0) {
        zones = parsedZones;
        activeZoneIndex = 0;
        renderZoneTabs();
        loadZoneData(0);
      }
    }

    async function exportPDF() {
      var jsPDF = window.jspdf.jsPDF;
      var scopeElem = document.getElementById('exportScope');
      var scope = scopeElem ? scopeElem.value : 'all';
      var targetZones = scope === 'current' ? [zones[activeZoneIndex]] : zones;

      var pdf = new jsPDF({
        orientation: 'landscape',
        unit: 'mm',
        format: 'a4'
      });

      var container = document.createElement('div');
      container.style.position = 'absolute';
      container.style.left = '-9999px';
      container.style.width = '850px';
      document.body.appendChild(container);

      for (var i = 0; i < targetZones.length; i++) {
        var zone = targetZones[i];
        var box = document.createElement('div');
        box.className = 'sheet-canvas';
        renderSheetHTML(box, zone);

        container.innerHTML = '';
        container.appendChild(box);

        var canvas = await html2canvas(box, { scale: 2 });
        var imgData = canvas.toDataURL('image/png');

        if (i > 0) pdf.addPage('a4', 'landscape');
        pdf.addImage(imgData, 'PNG', 10, 15, 277, 180);
      }

      document.body.removeChild(container);
      pdf.save('Planillas_Padel_' + ((targetZones[0] && targetZones[0].category) ? targetZones[0].category : 'Torneo') + '.pdf');
    }

    function exportPNG() {
      var element = document.getElementById('previewArea');
      if (!element) return;
      html2canvas(element, { scale: 2 }).then(function(canvas) {
        var link = document.createElement('a');
        link.download = 'Planilla_Zona_' + (zones[activeZoneIndex] ? zones[activeZoneIndex].zone : 'A') + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    window.onload = function() {
      renderZoneTabs();
      loadZoneData(activeZoneIndex);
    };
  </script>
</body>
</html>
